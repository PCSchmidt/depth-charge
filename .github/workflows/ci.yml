name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Tests (model, spikes S1/S2/S7/S8, client API)
        run: python -m pytest python/tests -q
        # S8 here also gives a first cross-platform determinism data point (Linux vs Windows, Python 3.12)
